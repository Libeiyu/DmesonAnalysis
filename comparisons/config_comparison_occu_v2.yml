inputs:
    dirname: null # leave null if not common for all input files
    filenames: [
        /home/wuct/ALICE/local/reso/DmesonAnalysis/run3/flow/Results/cutvar_int_occu/ry/raw_yields_int_occu_00.root,
        /home/wuct/ALICE/local/reso/DmesonAnalysis/run3/flow/Results/cutvar_hig_occu/ry/raw_yields_hig_occu_00.root,
        /home/wuct/ALICE/local/reso/DmesonAnalysis/run3/flow/Results/cutvar_low_occu/ry/raw_yields_low_occu_00.root,
        /home/wuct/ALICE/local/reso/DmesonAnalysis/run3/flow/Results/cutvar_med_occu/ry/raw_yields_med_occu_00.root
    ]

    objectnames: [hvnSimFit, hvnSimFit, hvnSimFit, hdvnSimFit, hEffPrompt, hEffFD, hEffPrompt, hEffFD] # can be either histograms of graphs or a mix of them; they will be drawn in the current order

output: 
    filename: /home/wuct/ALICE/local/reso/DmesonAnalysis/run3/flow/reso/Results/0100/k0100/large/sp/v2_occupancy # with path and w/o extension
    extensions: [pdf, root] # possibilities: pdf, eps, png, root

options:
    ROOTobject: [TGraphAsymmErrors, TGraphAsymmErrors, TGraphAsymmErrors, TGraphAsymmErrors, TH1, TH1, TH1, TH1, TH1] # TH1 or TGraph: no need to specify TH1F, TH1D or TGraphErrors, TGraphAsymmErrors
    scale: [1., 1., 1., 1., 1., 1., 1., 1., 1.]
    lambdaParams: [1., 1., 1., 1., 1., 1., 1., 1., 1.] # counts -> (counts - 1) * lambda + 1
    normalize: [false, false, false, false, false, false, false, false, false] # divide histogram by its area
    colors: [kBlack, kRed+1, kAzure+4, kGreen+2, kOrange+7,kBlack, kRed+1,  kRed+1, kAzure+47,kAzure+47, kOrange+7,   kOrange+7, kBlack, kBlack, kRed+1, kRed+1, kAzure+4, kGreen+2, kOrange+7, kMagenta+1, kBlue, kCyan+3, kSpring-5]
    markers: [kFullSquare, kFullCircle, kFullCircle, kFullCircle, kFullCircle, kOpenSquare, kFullCircle, kOpenSquare, kFullCircle, kFullCircle, kFullSquare, kFullSquare, kFullSquare, kFullSquare, kFullSquare]
    markersize: 1
    linewidth: 2
    fillstyle: [1,1,1,1,1,1,1,1,1]
    fillalpha: [1,1,1,1,1,1,1,1,1]
    drawopt: [p, p, p, p, l, l, l, l, p]
    
    ratio: 
        enable: true
        uncertainties:
            enable: false
            corr: false
        displayRMS: false
        multiRatio: false
        indexNumerator: [0, 2]
        indexDenominator: [1, 3]

    errcomp: # comparison of uncertainties
        enable: true
        relative: false

    legend:
        avoid: false #set true to avoid the legend in the final plot
        xlimits: [0.2, 0.9]
        ylimits: [0.8, 0.9]
        header: null
        # titles: [prompt pass4, fd pass4, prompt pass3, fd pass3]
        titles: [int_occu, hig_occu, low_occu, med_occu]
        # titles: [raw yield, raw yield sim. fit]
        # titles: [corr. strategy, uncorr. strategy, combined strategy]
        options: [lp, lp, lp, lp, l, lp, lp, lp, lp]
        textsize: 0.035
        ncolumns: 2

    text:
        x: [0.6, 0.8]
        y: [0.6, 0.9]
        text: "Pass3 MC"
        textsize: 0.04
        textfont: 42
        textalign: 12

    canvas:
        width: 2190
        heigth: 1080
        xaxistitle: '#it{p}_{T} (GeV/#it{c})'
        # yaxistitle: "#it{R}_{2} {SP}"
        yaxistitle: 'Inclusive D^{0} v_{2}'
        # yaxistitle: 'Raw yield'
        xlimits: [0.4, 26]
        ylimits: [-0.1, 0.3]
        ylimitsratio: [0., 2.1]
        ylimitserr: [0., 0.35]
        logy: false
        logx: true
        ratio:
            logy: false
            logx: false
        errcomp:
            logy: false
            logx: false  
